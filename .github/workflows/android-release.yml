name: Android latest release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-latest-release
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android workload
        run: dotnet workload install android --skip-manifest-update

      - name: Restore Android application
        run: dotnet restore src/MusicLibrary.App.Android/MusicLibrary.App.Android.csproj

      - name: Build APK (debug-signed)
        shell: bash
        run: |
          dotnet publish src/MusicLibrary.App.Android/MusicLibrary.App.Android.csproj \
            --configuration Release \
            --framework net10.0-android36.0 \
            --no-restore \
            --output artifacts/android \
            -p:AndroidPackageFormat=apk
          find artifacts/android -type f -name '*.apk' -print -quit | xargs -I{} cp {} artifacts/music-library-latest.apk

      - name: Upload workflow APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: music-library-latest-apk
          path: artifacts/music-library-latest.apk
          if-no-files-found: error

      - name: Create or update latest release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest artifacts/music-library-latest.apk \
            --target "$GITHUB_SHA" \
            --title "Latest" \
            --prerelease \
            --notes "Latest Android APK build."